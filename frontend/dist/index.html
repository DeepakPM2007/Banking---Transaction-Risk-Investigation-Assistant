<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Risk Investigation Assistant</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #131826;
      --bg-card-hover: #1a2235;
      --border: #232b3e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left i { color: var(--accent); font-size: 24px; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
    .track { font-size: 12px; color: var(--text-muted); background: var(--bg-dark); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); font-weight: 500;}

    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* ── Top Controls & Customer Panel ── */
    .dashboard-top {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .selector-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .selector-card label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
    select {
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus { border-color: var(--accent); }
    
    button#runBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button#runBtn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    button#runBtn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

    .customer-details-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0.5;
      transition: opacity 0.3s;
    }
    .customer-details-card.active { opacity: 1; }
    .customer-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .avatar { 
      width: 56px; height: 56px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
    }
    .customer-name-wrapper h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .customer-name-wrapper p { font-size: 13px; color: var(--text-muted); }
    
    .customer-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .metric-small { background: var(--bg-dark); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .metric-small .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600;}
    .metric-small .val { font-size: 14px; font-weight: 600; color: var(--text-main); }

    /* ── Spinner ── */
    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Headline banner ── */
    #banner {
      display: none;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 6px solid;
      animation: slideDown 0.4s ease-out;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    #banner.clean     { background: rgba(16, 185, 129, 0.1); border-color: var(--success); }
    #banner.review    { background: rgba(245, 158, 11, 0.1); border-color: var(--warning); }
    #banner.investigate { background: var(--danger-bg); border-color: var(--danger); }
    
    .banner-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;}
    #banner .status-badge {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    #banner.clean .status-badge     { color: var(--success); }
    #banner.review .status-badge    { color: var(--warning); }
    #banner.investigate .status-badge { color: var(--danger); }
    
    #banner .headline-text { font-size: 18px; font-weight: 500; line-height: 1.4;}
    #banner .source-tag { font-size: 12px; color: var(--text-muted); background: var(--bg-dark); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);}

    /* ── Profile metrics row ── */
    #profileRow {
      display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .stat-card .val { font-size: 18px; font-weight: 600; }
    .stat-card i { color: var(--accent); opacity: 0.7; }
    .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;}

    /* ── Findings ── */
    #findingsSection { display: none; margin-bottom: 40px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
    .section-title i { color: var(--text-muted); }

    .finding-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }
    .finding-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .finding-card.severity-high::before { background: var(--danger); }
    .finding-card.severity-medium::before { background: var(--warning); }

    .finding-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .rule-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--bg-dark); color: var(--accent); border: 1px solid var(--border);}
    .severity-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    .severity-badge.high   { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    .severity-badge.medium { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .finding-name { font-size: 16px; font-weight: 600; }
    
    .narrative { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px; }
    
    .check-first {
      font-size: 14px; background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent); padding: 12px 16px;
      border-radius: 0 8px 8px 0; color: #e2e8f0; margin-bottom: 20px;
    }
    .check-first strong { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}

    /* ── Tables ── */
    .cited-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;}
    .table-container { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 12px 16px; background: var(--bg-dark); color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-card-hover); }
    .txn-id { font-family: 'Fira Code', monospace; color: var(--accent); font-size: 12px;}
    .amount { font-weight: 600; color: #fff; }
    .channel-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-muted); text-transform: uppercase;}
    .hour-odd { color: #fca5a5; font-weight: 600; background: rgba(239,68,68,0.1); padding: 2px 6px; border-radius: 4px;}

    /* ── Full history section ── */
    #historySection { display: none; margin-top: 20px;}
    .history-toggle {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: background 0.2s;
    }
    .history-toggle:hover { background: var(--bg-card-hover); }
    .history-toggle h2 { font-size: 15px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px;}
    .history-toggle h2 i { color: var(--text-muted); }
    #historyTableWrap { display: none; margin-top: 16px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    #historyTable tr.highlighted td { background: rgba(239, 68, 68, 0.05); }

    /* ── Error ── */
    #errorBox {
      display: none; background: var(--danger-bg); border: 1px solid var(--danger);
      border-radius: 12px; padding: 16px; color: #fca5a5; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <i class="fa-solid fa-shield-halved"></i>
      <h1>RiskAI Investigator</h1>
    </div>
    <span class="track"><i class="fa-solid fa-code-branch"></i> PS06 Hackathon</span>
  </header>

  <div class="container">
    <div class="dashboard-top">
      <!-- Selector -->
      <div class="selector-card">
        <label><i class="fa-regular fa-folder-open"></i> Select Case File</label>
        <select id="customerSelect">
          <option value="">-- Choose a customer profile --</option>
        </select>
        <button id="runBtn" disabled>
          <span id="btnText">Run AI Investigation</span>
          <div class="spinner" id="spinner"></div>
          <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
        </button>
      </div>

      <!-- Customer Details Dummy Panel -->
      <div class="customer-details-card" id="customerPanel">
        <div class="customer-header">
          <div class="avatar" id="cAvatar">?</div>
          <div class="customer-name-wrapper">
            <h2 id="cName">Select a customer</h2>
            <p id="cAcc">Account info will appear here</p>
          </div>
        </div>
        <div class="customer-metrics">
          <div class="metric-small">
            <div class="label">Status</div>
            <div class="val" id="cStatus">-</div>
          </div>
          <div class="metric-small">
            <div class="label">Customer Since</div>
            <div class="val" id="cSince">-</div>
          </div>
          <div class="metric-small">
            <div class="label">Risk Tier (Prev)</div>
            <div class="val" id="cTier">-</div>
          </div>
        </div>
      </div>
    </div>

    <div id="errorBox" style="display:none;"></div>
    
    <div id="banner">
      <div class="banner-header">
        <div class="status-badge" id="bannerStatus"></div>
        <div class="source-tag" id="bannerSource"></div>
      </div>
      <div class="headline-text" id="bannerHeadline"></div>
    </div>

    <div id="profileRow"></div>

    <div id="findingsSection">
      <div class="section-title"><i class="fa-solid fa-magnifying-glass-chart"></i> Investigation Findings</div>
      <div id="findingsContainer"></div>
    </div>

    <div id="historySection">
      <div class="history-toggle" id="historyToggle">
        <h2><i class="fa-solid fa-list"></i> Full Transaction Ledger</h2>
        <i class="fa-solid fa-chevron-down" id="historyIcon"></i>
      </div>
      <div id="historyTableWrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>TXN ID</th><th>Date</th><th>Payee</th><th>Description</th>
              <th>Amount (₹)</th><th>Channel</th><th>Hour</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let allTransactions = [];
    let citedIds = new Set();

    // ── Dummy Customer Data ───────────────────────────────────────────────────
    const CUSTOMER_DB = {
      'clean_customer': {
        name: 'Aarav Sharma', initials: 'AS', acc: 'ACC-XXXX-4592', 
        status: '<span style="color:#10b981">Active</span>', since: 'Mar 2021', tier: 'Low'
      },
      'layered_anomaly_customer': {
        name: 'Neha Gupta', initials: 'NG', acc: 'ACC-XXXX-8812', 
        status: '<span style="color:#10b981">Active</span>', since: 'Jan 2024', tier: 'Medium'
      }
    };

    document.getElementById('customerSelect').addEventListener('change', (e) => {
      const id = e.target.value;
      const btn = document.getElementById('runBtn');
      const panel = document.getElementById('customerPanel');
      
      if (!id) {
        btn.disabled = true;
        panel.classList.remove('active');
        document.getElementById('cAvatar').textContent = '?';
        document.getElementById('cName').textContent = 'Select a customer';
        document.getElementById('cAcc').textContent = 'Account info will appear here';
        document.getElementById('cStatus').textContent = '-';
        document.getElementById('cSince').textContent = '-';
        document.getElementById('cTier').textContent = '-';
        return;
      }
      
      btn.disabled = false;
      panel.classList.add('active');
      const data = CUSTOMER_DB[id] || {name: id, initials: 'XX', acc: 'Unknown', status: 'Active', since: '-', tier: '-'};
      
      document.getElementById('cAvatar').textContent = data.initials;
      document.getElementById('cName').textContent = data.name;
      document.getElementById('cAcc').textContent = data.acc;
      document.getElementById('cStatus').innerHTML = data.status;
      document.getElementById('cSince').textContent = data.since;
      document.getElementById('cTier').textContent = data.tier;
    });


    // ── Load customers ────────────────────────────────────────────────────────
    async function loadCustomers() {
      try {
        const res = await fetch(`${API}/api/customers`);
        const data = await res.json();
        const sel = document.getElementById('customerSelect');
        data.customers.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id;
          const prettyName = CUSTOMER_DB[id] ? `${CUSTOMER_DB[id].name} (${id.replace(/_/g, ' ')})` : id;
          opt.textContent = prettyName;
          sel.appendChild(opt);
        });
      } catch (e) {
        showError('Failed to load customers. Is the backend running?');
      }
    }

    // ── Run investigation ─────────────────────────────────────────────────────
    document.getElementById('runBtn').addEventListener('click', async () => {
      const customerId = document.getElementById('customerSelect').value;
      if (!customerId) return;
      clearUI();
      setLoading(true);
      try {
        const [investRes, txnRes] = await Promise.all([
          fetch(`${API}/api/customers/${customerId}/investigate`),
          fetch(`${API}/api/customers/${customerId}/transactions`),
        ]);

        if (!investRes.ok) throw new Error(`Investigation failed: ${investRes.status}`);
        if (!txnRes.ok) throw new Error(`Transactions failed: ${txnRes.status}`);

        const investData = await investRes.json();
        const txnData = await txnRes.json();
        allTransactions = txnData.transactions || [];

        renderReport(investData);
        renderHistory();
      } catch (e) {
        showError(e.message);
      } finally {
        setLoading(false);
      }
    });

    // ── Render report ─────────────────────────────────────────────────────────
    function renderReport(data) {
      const report = data.report;
      const rawFindings = data.raw_findings || [];
      const profile = data.profile || {};

      // Banner
      const banner = document.getElementById('banner');
      const cls = report.status === 'clean' ? 'clean' : (report.status === 'investigate' ? 'investigate' : 'review');
      const labelMap = { 
        clean: '<i class="fa-solid fa-circle-check"></i> Account Clean', 
        review_recommended: '<i class="fa-solid fa-triangle-exclamation"></i> Review Recommended', 
        investigate: '<i class="fa-solid fa-radiation"></i> Investigate Immediately' 
      };
      
      banner.className = cls;
      banner.style.display = 'block';
      document.getElementById('bannerStatus').innerHTML = labelMap[report.status] || report.status;
      document.getElementById('bannerHeadline').textContent = report.headline;
      document.getElementById('bannerSource').innerHTML = report.source === 'fallback' 
        ? '<i class="fa-solid fa-robot"></i> Deterministic Engine (Fallback)' 
        : '<i class="fa-solid fa-sparkles"></i> Gemini AI Report';

      // Profile pills
      const profileRow = document.getElementById('profileRow');
      profileRow.style.display = 'grid';
      profileRow.innerHTML = `
        <div class="stat-card">
          <div class="stat-header"><span class="label">Avg Transaction</span><i class="fa-solid fa-money-bill-wave"></i></div>
          <div class="val">₹${profile.mean_amount?.toLocaleString()}</div>
        </div>
        <div class="stat-card">
          <div class="stat-header"><span class="label">Historical Max</span><i class="fa-solid fa-arrow-trend-up"></i></div>
          <div class="val">₹${profile.max_amount?.toLocaleString()}</div>
        </div>
        <div class="stat-card">
          <div class="stat-header"><span class="label">Standard Hrs</span><i class="fa-regular fa-clock"></i></div>
          <div class="val">${profile.active_hour_p10}:00 - ${profile.active_hour_p90}:59</div>
        </div>
        <div class="stat-card">
          <div class="stat-header"><span class="label">Preferred Channel</span><i class="fa-solid fa-mobile-screen"></i></div>
          <div class="val" style="text-transform: capitalize;">${profile.dominant_channel}</div>
        </div>
      `;

      // Findings
      citedIds = new Set();
      report.findings.forEach(f => (f.txn_ids || []).forEach(id => citedIds.add(id)));

      const fc = document.getElementById('findingsContainer');
      if (report.findings.length === 0) {
        fc.innerHTML = `
          <div class="finding-card" style="text-align: center; padding: 40px; color: var(--text-muted);">
            <i class="fa-regular fa-face-smile" style="font-size: 32px; margin-bottom: 12px; color: var(--success);"></i>
            <p>No anomalies detected. All transactions align with established baseline behavior.</p>
          </div>`;
      } else {
        report.findings.forEach((f, i) => {
          const raw = rawFindings.find(r => r.rule_id === f.rule_id) || {};
          const severity = raw.severity || 'medium';
          const cited = (f.txn_ids || []).map(tid => allTransactions.find(t => t.txn_id === tid)).filter(Boolean);

          const card = document.createElement('div');
          card.className = `finding-card severity-${severity}`;
          card.innerHTML = `
            <div class="finding-header">
              <span class="rule-badge"><i class="fa-solid fa-fingerprint"></i> ${f.rule_id}</span>
              <span class="severity-badge ${severity}">${severity} Priority</span>
              <span class="finding-name">${ruleNameMap[f.rule_id] || f.rule_id}</span>
            </div>
            <div class="narrative">${f.narrative}</div>
            <div class="check-first">
              <strong><i class="fa-solid fa-clipboard-list"></i> Investigator Action Required</strong>
              ${f.check_first}
            </div>
            <div class="cited-title">Flagged Evidence (${cited.length} Transactions)</div>
            <div class="table-container">
              ${buildTxnTable(cited)}
            </div>
          `;
          fc.appendChild(card);
        });
      }

      document.getElementById('findingsSection').style.display = 'block';
    }

    const ruleNameMap = {
      R1: 'Unusually Large Transfer', R2: 'Burst to Newly Added Payee',
      R3: 'Odd-Hours Activity', R4: 'Pattern Break',
    };

    function buildTxnTable(txns) {
      if (!txns.length) return '<div style="padding: 16px; color: var(--text-muted);">No transactions cited.</div>';
      const rows = txns.map(t => {
        const isOddHour = t.hour < 6 || t.hour > 22;
        return `<tr>
          <td><span class="txn-id">${t.txn_id}</span></td>
          <td>${t.date}</td>
          <td>${t.payee}</td>
          <td>${t.description}</td>
          <td class="amount">₹${Number(t.amount).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
          <td><span class="channel-badge">${t.channel}</span></td>
          <td><span class="${isOddHour ? 'hour-odd' : ''}">${t.hour}:00</span></td>
        </tr>`;
      }).join('');
      return `<table><thead><tr><th>TXN ID</th><th>Date</th><th>Payee</th><th>Description</th><th>Amount (₹)</th><th>Channel</th><th>Hour</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    // ── Full history ──────────────────────────────────────────────────────────
    function renderHistory() {
      const body = document.getElementById('historyBody');
      body.innerHTML = '';
      allTransactions.forEach(t => {
        const isOddHour = t.hour < 6 || t.hour > 22;
        const isCited = citedIds.has(t.txn_id);
        const tr = document.createElement('tr');
        if (isCited) tr.classList.add('highlighted');
        tr.innerHTML = `
          <td><span class="txn-id">${t.txn_id}</span></td>
          <td>${t.date}</td>
          <td>${t.payee}</td>
          <td>${t.description}</td>
          <td class="amount">₹${Number(t.amount).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
          <td><span class="channel-badge">${t.channel}</span></td>
          <td><span class="${isOddHour ? 'hour-odd' : ''}">${t.hour}:00</span></td>
        `;
        body.appendChild(tr);
      });
      document.getElementById('historySection').style.display = 'block';
    }

    document.getElementById('historyToggle').addEventListener('click', () => {
      const wrap = document.getElementById('historyTableWrap');
      const icon = document.getElementById('historyIcon');
      const open = wrap.style.display === 'block';
      wrap.style.display = open ? 'none' : 'block';
      icon.className = open ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
    });

    // ── Utilities ─────────────────────────────────────────────────────────────
    function setLoading(on) {
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
      document.getElementById('btnText').style.display = on ? 'none' : 'block';
      document.getElementById('btnIcon').style.display = on ? 'none' : 'block';
      document.getElementById('runBtn').disabled = on;
    }

    function clearUI() {
      document.getElementById('banner').style.display = 'none';
      document.getElementById('profileRow').style.display = 'none';
      document.getElementById('findingsSection').style.display = 'none';
      document.getElementById('historySection').style.display = 'none';
      document.getElementById('historyTableWrap').style.display = 'none';
      document.getElementById('findingsContainer').innerHTML = '';
      document.getElementById('historyBody').innerHTML = '';
      document.getElementById('errorBox').style.display = 'none';
      allTransactions = [];
      citedIds = new Set();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`;
      box.style.display = 'flex';
    }

    // Init
    loadCustomers();
  </script>
</body>
</html>
